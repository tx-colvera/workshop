filters:
  - filter_type: dir
    file_format: HTML_FRAGMENT
    source_language: en
    source_file_extension: html
    source_file_dir: comms_templates/lyft/emails/en
    translation_files_expression: 'comms_templates/lyft/emails/<lang>/'

    - filter_type: file
    # all supported i18n types: https://docs.transifex.com/formats
    file_format: po
    source_language: en
    source_file: source/en.po
    # path expression to translation files, must contain <lang> placeholder
    translation_files_expression: Translations/languages/<lang>.json


